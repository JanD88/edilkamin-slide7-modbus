# Edilkamin Slide 7 (PELE1712) -> ESPHome, via modbus_controller.
#
# Bus: 19200 8E1, slave 10, on the control board's A/B header.
# Every address below is the 0-based WIRE address = modpoll reference - 1;
# each carries a `# ref` comment so the off-by-one stays checkable.
#
# ** This config can ignite the stove. Read the README before deploying it. **

substitutions:
  name: edilkamin
  friendly_name: Stove

  rs485_tx: GPIO22
  rs485_rx: GPIO21

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - stove_states.h          # generated state-name table
  on_boot:
    priority: -100
    then:
      - script.execute: led_selftest

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  # To debug Modbus framing, set `level: VERY_VERBOSE` and RE-FLASH ESPHome

api:
  encryption:
    key: !secret edilkamin_api_key


ota:
  - platform: esphome
    password: !secret edilkamin_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret edilkamin_ap_password
  on_connect:
    - globals.set:
        id: net_up
        value: 'true'
  on_disconnect:
    - globals.set:
        id: net_up
        value: 'false'

captive_portal:


# ---------------------------------------------------------------- web UI -----
# Standalone control page at http://<device-ip>/ no Home Assistant needed.

web_server:
  port: 80
  version: 3
  auth:
    username: !secret edilkamin_web_username
    password: !secret edilkamin_web_password

  sorting_groups:
    - id: group_control
      name: "Control"
      sorting_weight: 10
    - id: group_status
      name: "Status"
      sorting_weight: 20
    - id: group_diagnostic
      name: "Diagnostics"
      sorting_weight: 30

# LilyGO T-CAN485: 5V_EN 16, RS485_EN 17, TX 22, RX 21, SE 19, WS2812 4.
# NOTE the board uses GPIO16/17 for its own power and transceiver control, so
# the UART MUST be on 21/22 a generic ESP32 RS485 pinout gives a dead bus.

uart:
  id: uart_rs485
  tx_pin: ${rs485_tx}
  rx_pin: ${rs485_rx}
  baud_rate: 19200
  data_bits: 8
  parity: EVEN
  stop_bits: 1

modbus:
  id: modbus_rs485
  uart_id: uart_rs485
  flow_control_pin: GPIO17


# ------------------------------------------------------------ status LED -----
# Colour = which layer is unhappy, pattern = how urgent. Priority-ordered.
#
#   0  off              disabled by the Status LED switch
#   1  white  steady    starting up
#   2  blue   fast      no WiFi
#   3  magenta slow     stove not answering
#   4  red    fast      stove ALARM
#   5  amber  slow      igniting (states 5-9)
#   6  amber  steady    burning (states 21-25 / 31-35)
#   7  green  very dim  idle, healthy
#
# "Stove not answering" outranks "alarm" on purpose: with the bus down the alarm
# flag is stale, and showing red from stale data would be a lie.

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    internal: true             # driven by the interval below
    pin: GPIO4
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB        # was `rgb_order` in older ESPHome
    use_psram: false           # T-CAN485 has NO PSRAM and this defaults to true
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

globals:
  - id: selftest
    type: bool
    initial_value: 'false'
  - id: net_up
    type: bool
    initial_value: 'false'
  - id: bus_up
    type: bool
    initial_value: 'false'
  - id: bus_ever_up
    type: bool
    restore_value: false
    initial_value: 'false'

script:

  - id: led_selftest
    mode: restart
    then:
      - globals.set:
          id: selftest
          value: 'true'
      - logger.log: "LED self-test 1/3: RED via light.turn_on action"
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%
      - delay: 800ms
      - logger.log: "LED self-test 2/3: GREEN via LightCall lambda"
      - lambda: |-
          auto call = id(status_led).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);
          call.set_brightness(1.0f);
          call.set_transition_length(0);
          call.perform();
      - delay: 800ms
      - logger.log: "LED self-test 3/3: BLUE via light.turn_on action"
      - light.turn_on:
          id: status_led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 100%
      - delay: 800ms
      - lambda: |-
          ESP_LOGI("led", "self-test done. gate status_led_on = %s | light is %s",
                   id(status_led_on).state ? "ON" : "OFF (interval holds it dark)",
                   id(status_led).current_values.is_on() ? "on" : "off");
      - globals.set:
          id: selftest
          value: 'false'


interval:
  - interval: 250ms
    then:
      - lambda: |
          static bool have_last = false;
          static bool last_lit = false;
          static float lr = 0, lg = 0, lb = 0, lbright = 0;
          static int last_branch = -1;
          static bool was_selftest = false;
          if (id(selftest)) { was_selftest = true; return; }
          if (was_selftest) {
            was_selftest = false;
            have_last = false;
          }

          const uint32_t now = millis();
          const bool fast = (now % 500) < 250;        // 2 Hz
          const bool slow = (now % 2000) < 1000;      // 0.5 Hz

          const float raw = id(stove_state_code).state;
          const int st = std::isnan(raw) ? -1 : (int) raw;
          const bool igniting = (st >= 5 && st <= 9);
          const bool running  = (st >= 21 && st <= 25) || (st >= 31 && st <= 35);

          const bool booting = !id(bus_ever_up) && now < 30000;

          float r = 0, g = 0, b = 0, bright = 0.15f;
          bool lit = true;
          int branch; const char *why;

          if (!id(status_led_on).state) {             // 0 switched off
            lit = false;
            branch = 0; why = "disabled by the Status LED switch";
          } else if (booting) {                       // 1 starting up
            r = g = b = 1.0f; bright = 0.10f;
            branch = 1; why = "starting up (white, steady)";
          } else if (!id(net_up)) {                   // 2 no WiFi
            b = 1.0f; bright = 0.35f; lit = fast;
            branch = 2; why = "no WiFi (blue, fast)";
          } else if (!id(bus_up)) {                   // 3 stove not answering
            r = 1.0f; b = 1.0f; bright = 0.35f; lit = slow;
            branch = 3; why = "stove not answering (magenta, slow)";
          } else if (id(stove_alarm).state) {         // 4 alarm
            r = 1.0f; bright = 0.45f; lit = fast;
            branch = 4; why = "stove ALARM (red, fast)";
          } else if (igniting) {                      // 5 igniting
            r = 1.0f; g = 0.35f; bright = 0.30f; lit = slow;
            branch = 5; why = "igniting (amber, slow)";
          } else if (running) {                       // 6 burning
            r = 1.0f; g = 0.30f; bright = 0.30f;
            branch = 6; why = "burning (amber, steady)";
          } else {                                    // 7 idle and healthy
            g = 1.0f; bright = 0.12f;
            branch = 7; why = "idle, healthy (green, dim)";
          }


          if (branch != last_branch) {
            last_branch = branch;
            id(led_branch).publish_state(why);
            ESP_LOGI("led", "branch %d: %s", branch, why);
          }


          const bool changed = !have_last || lit != last_lit ||
                               (lit && (r != lr || g != lg || b != lb || bright != lbright));
          if (!changed) return;
          have_last = true; last_lit = lit;
          lr = r; lg = g; lb = b; lbright = bright;

          if (lit) {
            auto call = id(status_led).turn_on();
            call.set_rgb(r, g, b);
            call.set_brightness(bright);
            call.set_transition_length(0);
            call.perform();
          } else {
            auto off = id(status_led).turn_off();
            off.set_transition_length(0);
            off.perform();
          }

modbus_controller:
  - id: stove
    modbus_id: modbus_rs485
    address: 10
    update_interval: 30s       # 3 commands per cycle; do not make this aggressive
    max_cmd_retries: 6         # rides out a GSM AT burst (default 4)
    offline_skip_updates: 2
    on_online:
      - globals.set:
          id: bus_up
          value: 'true'
      - globals.set:
          id: bus_ever_up
          value: 'true'
    on_offline:
      - globals.set:
          id: bus_up
          value: 'false'
      - text_sensor.template.publish:
          id: stove_state_name
          state: "no reply from stove"


# ------------------------------------------------------------------ power ----

switch:
  # Transceiver control. Both internal: restore_mode sets the right level at boot
  # and nothing should change them at runtime. Turning either off kills Modbus,
  - platform: gpio
    pin: GPIO16
    id: pin_5v_en
    name: "5V boost enable"
    internal: true
    restore_mode: ALWAYS_ON    # LOW = transceiver has no 5 V rail, bus silent

  - platform: gpio
    pin: GPIO19
    id: rs485_shdn
    name: "RS485 SHDN-bar"
    internal: true
    restore_mode: ALWAYS_ON    # LOW = transceiver in shutdown

  - platform: template
    id: status_led_on
    name: "Status LED"
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 5

  - platform: modbus_controller
    modbus_controller_id: stove
    id: stove_power
    name: "Power"
    web_server:
      sorting_group_id: group_control
      sorting_weight: 10
    icon: mdi:fire
    register_type: coil
    address: 1000              # ref 1001  THE power control, a coil not a register
    use_write_multiple: false  # FC5. FC15 is ACKed and then ignored by this stove.


# --------------------------------------------------------------- controls ----

number:
  - platform: modbus_controller
    modbus_controller_id: stove
    id: stove_target_temp
    name: "Target temperature"
    web_server:
      sorting_group_id: group_control
      sorting_weight: 20
    register_type: holding
    address: 1003              # ref 1004 degC x10, stove limits 50-350
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 5
    max_value: 35
    step: 0.1
    mode: box                  # NOT a slider: see the warning below
    icon: mdi:thermometer
    use_write_multiple: false  # FC6

    multiply: 10
    # ** THIS CONTROL CAN START A FIRE. ** A setpoint above room temperature has
    # ignited the stove by itself: coil 1001 went 0  1 with nobody touching the

  - platform: modbus_controller
    modbus_controller_id: stove
    id: stove_power_demand
    name: "Power level demand"
    web_server:
      sorting_group_id: group_control
      sorting_weight: 30
    register_type: holding
    address: 1002              # ref 1003
    value_type: U_WORD
    min_value: 1
    max_value: 5
    step: 1
    mode: slider
    icon: mdi:speedometer
    use_write_multiple: false  # FC6


button:
  - platform: template
    name: "Run LED self-test"
    icon: mdi:led-on
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 6
    on_press:
      - script.execute: led_selftest




sensor:
  - platform: modbus_controller
    modbus_controller_id: stove
    id: stove_state_code
    name: "State code"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 30
    register_type: read
    address: 1000              # ref 1001
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    on_value:
      then:
        - if:
            condition:
              lambda: return !std::isnan(x);
            then:
              - globals.set:
                  id: bus_up
                  value: 'true'
              - globals.set:
                  id: bus_ever_up
                  value: 'true'
              - text_sensor.template.publish:
                  id: stove_state_name
                  state: !lambda return ek_state_name((int) x);
              - text_sensor.template.publish:
                  id: stove_alarm_name
                  state: !lambda |
                    int v = (int) x;
                    return ek_state_is_alarm(v) ? ek_state_name(v) : std::string("None");
              - binary_sensor.template.publish:
                  id: stove_alarm
                  state: !lambda return ek_state_is_alarm((int) x);
              - sensor.template.publish:
                  id: stove_level_actual
                  state: !lambda |
                    int v = (int) x;

                    if (v >= 21 && v <= 25) return (float) (v - 20);
                    if (v >= 31 && v <= 35) return (float) (v - 30);
                    return NAN;

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Temperature ref 1003"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 40
    register_type: read
    address: 1002              # ref 1003, tenths
    reuse_previous_range: true
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

    filters:
      - lambda: |-
          return x == -435 ? NAN : x / 10.0f;

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Unknown ref 1007"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 60
    register_type: read
    address: 1006              # ref 1007
    reuse_previous_range: true
    value_type: U_WORD
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Fan speed configured"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 70
    register_type: read
    address: 1007              # ref 1008
    reuse_previous_range: true
    value_type: U_WORD
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:fan
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Exchanger temperature"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 10
    register_type: read
    address: 1009              # ref 1010, tenths
    reuse_previous_range: true
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x == -435 ? NAN : x / 10.0f;

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Extractor rpm"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 20
    register_type: read
    address: 1017              # ref 1018
    reuse_previous_range: true
    value_type: U_WORD
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:fan


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Power level setting"
    id: holding_range_anchor
    internal: true
    register_type: holding
    address: 1002              # ref 1003
    value_type: U_WORD


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Setpoint 1"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 90
    register_type: holding
    address: 1004              # ref 1005, tenths
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x == -435 ? NAN : x / 10.0f;

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Setpoint 2"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 100
    register_type: holding
    address: 1005              # ref 1006, tenths
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x == -435 ? NAN : x / 10.0f;

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Holding ref 1007"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 80
    register_type: holding
    address: 1006              # ref 1007
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic


  - platform: template
    id: stove_level_actual
    name: "Power level (actual)"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 50
    icon: mdi:fire
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Flue gas temperature"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 60
    id: stove_flue_temp
    register_type: read
    address: 1014              # ref 1015, tenths
    reuse_previous_range: true
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:smoke

    filters:
      - lambda: |-
          return x == -435 ? NAN : x / 10.0f;

  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Power output"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 40
    register_type: read
    address: 1001              # ref 1002
    reuse_previous_range: true
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:fire


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Auger operating point"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 110
    register_type: read
    address: 1022              # ref 1023
    reuse_previous_range: true
    value_type: S_WORD
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:screw-lag


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Level operating point"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 120
    register_type: read
    address: 1023              # ref 1024
    reuse_previous_range: true
    value_type: S_WORD
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "State operating point"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 130
    register_type: read
    address: 1019
    reuse_previous_range: true
    value_type: S_WORD
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "State operating measurement"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 140
    register_type: read
    address: 1021
    reuse_previous_range: true
    value_type: S_WORD
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: stove
    name: "Temperature ref 1016"
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 50
    register_type: read
    address: 1015
    reuse_previous_range: true
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

    filters:
      - lambda: |-
          return x == -435 ? NAN : x / 10.0f;


text_sensor:
  - platform: template
    id: led_branch
    name: "LED state"
    icon: mdi:led-on
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostic
      sorting_weight: 7


  - platform: template
    id: stove_state_name
    name: "State"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 10
    icon: mdi:state-machine

  - platform: template
    id: stove_alarm_name
    name: "Alarm"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 30
    icon: mdi:alert-circle-outline


binary_sensor:
  - platform: template
    id: stove_alarm
    name: "Alarm active"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 20
    device_class: problem
